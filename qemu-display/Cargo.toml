[package]
name = "qemu-display"
version = "0.2.1"
authors = ["Marc-André Lureau <marcandre.lureau@redhat.com>"]
edition = { workspace = true }
rust-version = { workspace = true }

description = "Helper library to communicate with qemu -display dbus"
repository = { workspace = true }
keywords = ["D-Bus", "DBus", "QEMU", "Virtualization", "VM"]
license = { workspace = true }
categories = ["virtualization", "gui", "api-bindings"]

[features]
qmp = ["dep:qapi", "dep:base64"]

[dependencies]
tracing.workspace = true
zbus.workspace = true
cfg-if = "1.0"
derive_more = { version = "2.1", features = ["debug"] }
libc = "0.2"
enumflags2 = { version = "0.7", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_repr = "0.1"
serde_bytes = "0.11"
futures-util = { version = "0.3", features = ["async-await-macro"] }
once_cell = "1.19"
futures = "0.3"
async-broadcast = "0.7"
async-trait = "0.1"
async-lock = "3.4"
qapi = { version = "0.15", features = ["qmp"], optional = true }
base64 = { version = "0.22", optional = true }
memmap2 = "0.9.5"

[target.'cfg(windows)'.dependencies]
uds_windows = "1.1"
windows = { version = "0.61.3", features = [
    "Win32_Networking_WinSock",
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[target.'cfg(windows)'.dev-dependencies]
async-std = { version = "1.12", features = ["attributes"] }
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
], default-features = false }

[dev-dependencies]
pixman-sys.workspace = true
async-std = { version = "1.12", features = ["attributes"] }
tracing-subscriber = "0.3"
rand = "0.10"

[[example]]
name = 'win32-test'
required-features = ["qmp"]
