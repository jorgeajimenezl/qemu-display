[package]
name = "qemu-rdp"
version = "0.1.1"
authors = [
    "Mihnea Buzatu <mihneabuzatu88@gmail.com>",
    "Marc-André Lureau <marcandre.lureau@redhat.com>",
]
edition = "2021"
rust-version = { workspace = true }

description = "org.qemu.Display1 RDP server"
repository = { workspace = true }
keywords = ["RDP", "QEMU", "VM"]
license = { workspace = true }
categories = ["virtualization", "gui", "network-programming"]


[dependencies]
qemu-display.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
bytes = "1.6"
pixman-sys = "0.1.0"
rustls-pemfile = "2.1"
tokio = { version = "1.39", features = ["full"] }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "cargo"] }
async-trait = "0.1"
ironrdp = { version = "0.11.0", features = [
    "connector",
    "server",
    "svc",
    "cliprdr",
    "displaycontrol",
    "rdpsnd",
] }
futures-util = "0.3"
zbus.workspace = true
enumflags2 = "0.7.10"
dirs = "6.0"
opus = "0.3"
