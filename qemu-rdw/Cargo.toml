[package]
name = "qemu-rdw"
version = "0.1.0"
authors = ["Marc-André Lureau <marcandre.lureau@redhat.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
qmp = ["qemu-display/qmp"]

[dependencies]
log = "0.4"
zbus.workspace = true
qemu-display.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter" , "fmt"], default-features = false }

[target.'cfg(unix)'.dependencies]
rdw = { package = "rdw4", version = "0.1", features = ["bindings"] }
rdw4-qemu = { version = "0.1" }

[target.'cfg(windows)'.dependencies]
uds_windows = "1.1.0"
windows = { version = "0.62", features = ["Win32_System_Memory", "Win32_Foundation"] }
rdw = { package = "rdw4", version = "0.1", features = ["bindings"], default-features = false }
rdw4-qemu = { version = "0.1", default-features = false }
